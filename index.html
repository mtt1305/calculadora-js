<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="calculator" aria-label="Calculadora">
    <header class="top">
      <div>
        <p class="eyebrow">CALCULADORA</p>
        <h1>Vamos calcular.</h1>
      </div>
      <span class="theme-icon" aria-hidden="true">☾</span>
    </header>

    <section class="display" aria-live="polite">
      <div id="previous" class="previous"></div>
      <output id="current" class="current">0</output>
    </section>

    <section class="keys" aria-label="Teclado da calculadora">
      <button class="key utility" data-action="clear">AC</button>
      <button class="key utility" data-action="delete" aria-label="Apagar último dígito">⌫</button>
      <button class="key operator" data-operator="÷">÷</button>
      <button class="key operator" data-operator="×">×</button>

      <button class="key" data-number="7">7</button>
      <button class="key" data-number="8">8</button>
      <button class="key" data-number="9">9</button>
      <button class="key operator" data-operator="−">−</button>

      <button class="key" data-number="4">4</button>
      <button class="key" data-number="5">5</button>
      <button class="key" data-number="6">6</button>
      <button class="key operator" data-operator="+">+</button>

      <button class="key" data-number="1">1</button>
      <button class="key" data-number="2">2</button>
      <button class="key" data-number="3">3</button>
      <button class="key equals" data-action="equals">=</button>

      <button class="key utility" data-action="sign">+/−</button>
      <button class="key" data-number="0">0</button>
      <button class="key" data-action="decimal">,</button>
    </section>
    <p class="hint">Dica: você também pode usar o teclado.</p>
  </main>
</body>
</html>
